<div class="card">
    <div class="card-heading">
        <h2>Simplified Textual Computations</h2>
    </div>
    <div class="card-body">
        <center>
            <h1 hidden style="text-decoration: none;">
                type sheet
            </h1>


        </center>
        <div class="divider">***************</div>

        <center>
            <p>

                <input spellcheck="false" onkeyup="funcSort()"
                    style="width:50%; max-width: 200px; min-width: 75px; text-align: center;" class="text-input"
                    type="text" id="function" placeholder="* * * function * * *">
                <a onclick="showShifts()" class="a" id="shiftName">funcs</a>



                <span id="inputVars">
                    <input spellcheck="false" onkeyup=""
                    style="width:50%; max-width: 75px; min-width: 50px; text-align: center;" class="text-input"
                    type="number" id="var1" placeholder="var"> 
                    
                    <span id="funcSign"><button onclick="minus()" class="abus" id="symbol">+</button></span>

                    <input spellcheck="false" onkeyup=""
                    style="width:50%; max-width: 75px; min-width: 50px; text-align: center;" class="text-input"
                    type="number" id="var2" placeholder="var">         
                </span>


                <span id="funcButt"><button onclick="addFunc()" class="abus" id="">=</button></span>
                <!--
                <button onclick="addVar()" class="abus" id="">+</button>
                -->
                
                
            </p>

            <section hidden>
                
            <span id="result"></span>    
            </section>



            <div id="shiftMenu" style="display: none" class="card">
                <div class="card-heading">Functions</div>
                <div class="card-body">

                    <p>
                        <a class="a" onclick="add(), showShifts()">add</a>
                        <a class="a" onclick="minus(), showShifts()">subtract</a>
                        <a class="a" onclick="multiply(), showShifts()">multiply</a>
                        <a class="a" onclick="divide(), showShifts()">divide</a>
                    </p>

                    <p>
                        <a class="a" onclick="exponent(), showShifts()">exponentiation</a>
                        <a class="a" onclick="root(), showShifts()">root</a>
                        <!--
                        <a class="a" onclick="sine(), showShifts()">sine</a>
                        <a class="a" onclick="divide(), showShifts()">divide</a>
                        -->
                    </p>


                </div>
                
            </div>

            <p> <button onclick="addLineMobile()" class="gbus" style="margin-top: 5px">Add Row</button>
                <button onclick="addEmptyLineMobile()" class="bbus" style="margin-top: 5px">Add Empty Row</button>
                <button onclick="removeLastLine()" class="obus" style="margin-top: 5px">Remove Row</button>    
                
            </p>



            <div class="divider">****PREVIEW****</div>
            <table class="table">
                <tr>
                    <td class="mercury" id="vizCell1">
                    
                    </td> 
                    <td class="mercury" id="symbolPrev">
                        
                    </td>     
                    <td class="mercury" id="vizCell2">
                        
                    </td>   
                    <td class="mercury" id="vizResult">
                        
                    </td>    
                </tr>
            </table>
            <div class="divider">***************</div>
            <span hidden id="varNum">2</span>
            <span hidden id="lastResult"></span>
            <span hidden id="color">var(--luminary)</span>
            <section hidden id="vars">
                <span id="2"></span>
            </section>

            <p id="synapse_options" style="display: none;"><button onclick="synapse_copy()" class="abus">Copy
                    Synapse</button> <button onclick="synapse_download()" class="abus">Download Synapse</button></p>


        </center>
    </div>

        <section id="sheetHeader" contenteditable="true">

        </section>

        <table id="sheetBody">


        
        </table>

        <section id="sheetFooter" contenteditable="true">

        </section>
